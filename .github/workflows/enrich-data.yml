name: Validate Data Contribution
on:
  pull_request:
    paths:
      - 'data/**'

jobs:
  validate-and-normalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout contribution
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up tools via Mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: yarn --frozen-lockfile --prefer-offline

      - name: Validate data consistency
        run: yarn data:validate

      - name: Normalize pre-reform Russian orthography
        run: yarn data:modernize-russian

      - name: Commit normalized data
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: normalize contributed data [skip ci]'
          file_pattern: '.'
          commit_user_name: 'GitHub Action'
          commit_user_email: 'action@github.com'
          skip_dirty_check: false
          skip_fetch: true
