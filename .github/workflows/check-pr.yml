name: Check PR
permissions:
  contents: read

on:
  pull_request:
    paths:
      - './**'
      - 'src/**'
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tools via Mise
        uses: jdx/mise-action@v4

      - name: Cache yarn dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tools via Mise
        uses: jdx/mise-action@v4

      - name: Cache yarn dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type check
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tools via Mise
        uses: jdx/mise-action@v4

      - name: Cache yarn dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run frontend tests
        run: yarn test --run
        env:
          NEXT_PUBLIC_GITHUB_OWNER: owner
          NEXT_PUBLIC_GITHUB_REPO: repo
          NEXT_PUBLIC_GISCUS_REPO_ID: repo-id
          NEXT_PUBLIC_GISCUS_CATEGORY_ID: category-id
          NEXT_PUBLIC_TYPESENSE_SEARCH_KEY: typesense-search-key
          NEXT_PUBLIC_TYPESENSE_HOST: typesense-host
          NEXT_PUBLIC_SITE: site

      - name: Run server tests
        run: yarn exec vitest run --root src/server
        env:
          NEXT_PUBLIC_GITHUB_OWNER: owner
          NEXT_PUBLIC_GITHUB_REPO: repo
          NEXT_PUBLIC_TYPESENSE_SEARCH_KEY: typesense-search-key
          NEXT_PUBLIC_TYPESENSE_HOST: typesense-host
          NEXT_PUBLIC_SITE: site
