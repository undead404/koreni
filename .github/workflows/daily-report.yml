name: Daily Telegram Records Digest
on:
  schedule:
    - cron: '0 18 * * *' # Запуск о 18:00 UTC (20:00/21:00 за Києвом)
  workflow_dispatch: # Дозволяє запустити Action вручну з інтерфейсу GitHub

permissions:
  contents: read
  actions: read
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Only current branch
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Find new records since the last successful report
        id: find-files
        run: |
          # Compare with the last successful report instead of using a moving time window.
          PREVIOUS_RUN=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-report.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0] // {} | {id: (.id // ""), head_branch: (.head_branch // ""), status: (.status // ""), conclusion: (.conclusion // ""), created_at: (.created_at // ""), head_sha: (.head_sha // "")}')
          PREVIOUS_RUN_ID=$(printf '%s' "$PREVIOUS_RUN" | jq -r '.id')
          PREVIOUS_RUN_BRANCH=$(printf '%s' "$PREVIOUS_RUN" | jq -r '.head_branch')
          PREVIOUS_RUN_STATUS=$(printf '%s' "$PREVIOUS_RUN" | jq -r '.status')
          PREVIOUS_RUN_CONCLUSION=$(printf '%s' "$PREVIOUS_RUN" | jq -r '.conclusion')
          PREVIOUS_RUN_CREATED_AT=$(printf '%s' "$PREVIOUS_RUN" | jq -r '.created_at')
          PREVIOUS_RUN_HEAD_SHA=$(printf '%s' "$PREVIOUS_RUN" | jq -r '.head_sha')
          START_COMMIT=$PREVIOUS_RUN_HEAD_SHA
          START_COMMIT_SOURCE=api
          if [ -z "$START_COMMIT" ]; then
            START_COMMIT=$(git rev-list --max-parents=0 HEAD | tail -n 1)
            START_COMMIT_SOURCE=root-fallback
          fi

          printf 'PREVIOUS_RUN_ID=%s\n' "$PREVIOUS_RUN_ID"
          printf 'PREVIOUS_RUN_HEAD_BRANCH=%s\n' "$PREVIOUS_RUN_BRANCH"
          printf 'PREVIOUS_RUN_STATUS=%s\n' "$PREVIOUS_RUN_STATUS"
          printf 'PREVIOUS_RUN_CONCLUSION=%s\n' "$PREVIOUS_RUN_CONCLUSION"
          printf 'PREVIOUS_RUN_CREATED_AT=%s\n' "$PREVIOUS_RUN_CREATED_AT"
          printf 'PREVIOUS_RUN_HEAD_SHA=%s\n' "$PREVIOUS_RUN_HEAD_SHA"
          printf 'START_COMMIT=%s\n' "$START_COMMIT"
          printf 'START_COMMIT_SOURCE=%s\n' "$START_COMMIT_SOURCE"
          CHECKOUT_HEAD_SHA=$(git rev-parse HEAD)
          printf 'CHECKOUT_HEAD_SHA=%s\n' "$CHECKOUT_HEAD_SHA"
          git diff --name-only --diff-filter=A "$START_COMMIT" HEAD | grep -E '^data/records/.*\.(yaml|yml)$' > added_files.txt || true

          # Вивести знайдені файли також в консоль
            CANDIDATE_COUNT=$(wc -l < added_files.txt | tr -d '[:space:]')
            printf 'CANDIDATE_COUNT=%s\n' "$CANDIDATE_COUNT"
            echo "added_files.txt:"
            cat added_files.txt
          if [ -s added_files.txt ]; then
            echo "has_files=true" >> $GITHUB_OUTPUT
          else
            echo "has_files=false" >> $GITHUB_OUTPUT
            echo "Нових файлів за добу не знайдено."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up tools via Mise
        if: steps.find-files.outputs.has_files == 'true'
        uses: jdx/mise-action@v4

      - name: Install dependencies
        if: steps.find-files.outputs.has_files == 'true'
        run: yarn install --immutable
        working-directory: src/daily-report

      - name: Run notification script
        working-directory: src/daily-report
        if: steps.find-files.outputs.has_files == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: yarn dev
