concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Check, Build, Deploy
permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - '*'
      - 'data/**'
      - 'scripts/server/**'
      - 'src/app/**'
      - 'src/server/**'
      - 'src/shared/**'
      - 'src/scripts/**'
      - 'src/types/**'
      - '.github/workflows/main.yml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tools via Mise
        uses: jdx/mise-action@v4

      - name: Cache yarn dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tools via Mise
        uses: jdx/mise-action@v4

      - name: Cache yarn dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type check
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tools via Mise
        uses: jdx/mise-action@v4

      - name: Cache yarn dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run frontend tests
        run: yarn test --run
        env:
          NEXT_PUBLIC_API_SITE: https://api.example.test
          NEXT_PUBLIC_GITHUB_OWNER: owner
          NEXT_PUBLIC_GITHUB_REPO: repo
          NEXT_PUBLIC_TYPESENSE_SEARCH_KEY: typesense-search-key
          NEXT_PUBLIC_TYPESENSE_HOST: typesense-host
          NEXT_PUBLIC_SITE: site
          NEXT_PUBLIC_OAUTH_CLIENT_ID: oauth-client-id

      - name: Run server tests
        run: yarn exec vitest run --root src/server
        env:
          GITHUB_REPO: owner/repo
          GITHUB_TOKEN: test-github-token
          JWT_SECRET: test-jwt-secret-with-at-least-32-characters
          KARMA_APP_SLUG: koreni
          KARMA_APP_TOKEN: test-karma-app-token
          NAVIGATOR_BASE_URL: https://www.uagenealogy.com
          NEXT_PUBLIC_GITHUB_OWNER: owner
          NEXT_PUBLIC_GITHUB_REPO: repo
          NEXT_PUBLIC_TYPESENSE_SEARCH_KEY: typesense-search-key
          NEXT_PUBLIC_TYPESENSE_HOST: typesense-host
          NEXT_PUBLIC_SITE: site
          OAUTH_CLIENT_ID: oauth-client-id
          POSTHOG_HOST: https://app.posthog.com
          POSTHOG_KEY: test-posthog-key
          TURNSTILE_SECRET_KEY: test-turnstile-secret-key

  build:
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tools via Mise
        uses: jdx/mise-action@v4

      - name: Cache yarn dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Restore Next.js Build Cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('src/**', 'data/**', 'next.config.ts', 'package.json') }}

      - name: Fetch volunteer email visibility policy
        run: yarn exec tsx src/scripts/fetch-email-visibility-policy.ts
        env:
          EMAIL_VISIBILITY_SYNC_TOKEN: ${{ secrets.EMAIL_VISIBILITY_SYNC_TOKEN }}
          NEXT_PUBLIC_API_SITE: ${{ vars.SITE }}

      - name: Build Next.js project
        run: yarn build
        env:
          NEXT_PUBLIC_API_SITE: ${{ vars.SITE }}
          NEXT_PUBLIC_BUGSNAG_API_KEY: ${{ vars.BUGSNAG_API_KEY }}
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
          NEXT_PUBLIC_LOCATIONIQ_KEY: ${{ secrets.LOCATIONIQ_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          NEXT_PUBLIC_REMARK42_HOST: ${{ vars.REMARK42_HOST }}
          NEXT_PUBLIC_OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          NEXT_PUBLIC_SITE: ${{ vars.SITE }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_TYPESENSE_SEARCH_KEY: ${{ vars.TYPESENSE_SEARCH_KEY }}
          NEXT_PUBLIC_TYPESENSE_HOST: ${{ vars.TYPESENSE_HOST }}
          NODE_ENV: production

      # 3. Upload Artifacts
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: out
          if-no-files-found: error

  build-api:
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tools via Mise
        uses: jdx/mise-action@v4

      - name: Cache yarn dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build API project
        run: |
          yarn exec tsc --project src/server/tsconfig.json
          yarn exec tsx src/server/src/scripts/generate-karma-stats.ts data src/server/dist/src/generated/karma-stats.json "${BUILD_REVISION}"
          cp src/server/package.json src/server/dist/
        env:
          BUILD_REVISION: ${{ github.sha }}

      - name: Install production dependencies
        run: yarn workspaces focus koreni-server --production

      - name: Upload backend artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-dist
          path: src/server/dist
          if-no-files-found: error

      - name: Upload backend node_modules artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-node-modules
          path: node_modules
          if-no-files-found: error

  deploy:
    name: Deploy frontend, API and Nginx
    runs-on: ubuntu-latest
    needs: [build, build-api]
    timeout-minutes: 30
    env:
      SITE_URL: ${{ vars.SITE }}
    steps:
      - name: Checkout repository for Nginx configuration
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine whether Nginx configuration changed
        id: nginx
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            changed=true
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "${BEFORE_SHA}^{commit}"; then
            if git diff --quiet "$BEFORE_SHA" "$CURRENT_SHA" -- scripts/server/nginx.conf; then
              changed=false
            else
              changed=true
            fi
          else
            # Missing push base: redeploy and validate Nginx rather than silently skip.
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SERVER_IP: ${{ vars.SERVER_IP }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null
          test -n "$SSH_USERNAME" && test -n "$SERVER_IP"
          cat > "$HOME/.ssh/config" <<EOF
          Host hetzner-deploy
              HostName $SERVER_IP
              User $SSH_USERNAME
              IdentityFile ~/.ssh/deploy_key
              IdentitiesOnly yes
              BatchMode yes
              StrictHostKeyChecking yes
          EOF
          chmod 600 "$HOME/.ssh/config"
          # Bootstrap trust: replace with a pinned SSH_KNOWN_HOSTS secret for stronger protection.
          ssh-keyscan -T 10 -H "$SERVER_IP" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          ssh hetzner-deploy 'whoami && hostname'

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Download API artifact
        uses: actions/download-artifact@v8
        with:
          name: api-dist
          path: api-dist

      - name: Download API dependencies
        uses: actions/download-artifact@v8
        with:
          name: api-node-modules
          path: api-node-modules

      - name: Validate artifacts
        run: |
          set -euo pipefail
          test -d dist && test -n "$(find dist -mindepth 1 -print -quit)"
          test -f api-dist/package.json
          test -d api-node-modules && test -n "$(find api-node-modules -mindepth 1 -print -quit)"

      - name: Write API environment file safely
        env:
          BUGSNAG_API_API_KEY: ${{ secrets.BUGSNAG_API_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.IMPORT_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          NEXT_PUBLIC_SITE: ${{ vars.SITE }}
          VALID_API_KEYS: ${{ vars.VALID_API_KEYS }}
          FALLBACK_EMAIL: ${{ secrets.FALLBACK_EMAIL }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          NEXT_PUBLIC_API_SITE: ${{ vars.SITE }}
          BUILD_REVISION: ${{ github.sha }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TURSO_DATABASE_URL: ${{ vars.TURSO_DATABASE_URL }}
          TURSO_DATABASE_TOKEN: ${{ secrets.TURSO_DATABASE_TOKEN }}
          KARMA_APP_TOKEN: ${{ secrets.KARMA_APP_TOKEN }}
          KARMA_INTERNAL_TOKEN: ${{ secrets.KARMA_INTERNAL_TOKEN }}
          EMAIL_VISIBILITY_SYNC_TOKEN: ${{ secrets.EMAIL_VISIBILITY_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PYCODE'
          import json, os
          keys = (
              'BUGSNAG_API_API_KEY', 'GITHUB_TOKEN', 'GITHUB_REPO',
              'TURNSTILE_SECRET_KEY', 'POSTHOG_KEY', 'POSTHOG_HOST',
              'NEXT_PUBLIC_SITE', 'VALID_API_KEYS', 'FALLBACK_EMAIL',
              'OAUTH_CLIENT_ID', 'NEXT_PUBLIC_API_SITE', 'BUILD_REVISION',
              'JWT_SECRET', 'TURSO_DATABASE_URL', 'TURSO_DATABASE_TOKEN',
              'KARMA_APP_TOKEN', 'KARMA_INTERNAL_TOKEN', 'EMAIL_VISIBILITY_SYNC_TOKEN'
          )
          values = {'PORT': '4000', 'NODE_ENV': 'production',
                    'KARMA_APP_SLUG': 'koreni',
                    'NAVIGATOR_BASE_URL': 'https://www.uagenealogy.com'}
          values.update({k: os.environ[k] for k in keys})
          # dotenv understands double-quoted strings; JSON escaping protects
          # quotes, newlines and literal $ from shell expansion.
          with open('api.env', 'w', encoding='utf-8') as f:
              for k, v in values.items():
                  f.write(f'{k}={json.dumps(v, ensure_ascii=False)}\n')
          PYCODE
          chmod 600 api.env

      - name: Transfer API files
        run: |
          set -euo pipefail
          ssh hetzner-deploy 'mkdir -p /var/www/koreni-api/node_modules'
          # Preserve the live .env and node_modules while syncing compiled code.
          rsync -az --no-o --no-g --delete \
            --exclude='/.env' --exclude='/node_modules/' \
            ./api-dist/ hetzner-deploy:/var/www/koreni-api/
          rsync -az --no-o --no-g --delete \
            ./api-node-modules/ hetzner-deploy:/var/www/koreni-api/node_modules/
          scp -q api.env hetzner-deploy:/var/www/koreni-api/.env.next
          ssh hetzner-deploy \
            'chmod 600 /var/www/koreni-api/.env.next && mv -f /var/www/koreni-api/.env.next /var/www/koreni-api/.env'
          rm -f api.env

      - name: Restart and verify API
        run: |
          set -euo pipefail
          ssh hetzner-deploy 'sudo -n systemctl restart koreni-api'
          ssh hetzner-deploy 'sudo -n systemctl is-active --quiet koreni-api'
          # Public health route exists in the original workflow.
          site="${SITE_URL:-https://koreni.org.ua}"
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-connrefused \
            --max-time 10 "${site%/}/api/health" > /dev/null

      - name: Deploy frontend
        run: |
          set -euo pipefail
          rsync -az --no-o --no-g --delete \
            --chmod=D755,F644 \
            ./dist/ hetzner-deploy:/var/www/html/

      - name: Check frontend
        run: |
          set -euo pipefail
          site="${SITE_URL:-https://koreni.org.ua}"
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --max-time 10 "${site%/}/" > /dev/null

      - name: Upload and activate Nginx configuration
        id: nginx_deploy
        if: steps.nginx.outputs.changed == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          scp -q scripts/server/nginx.conf hetzner-deploy:/tmp/koreni-nginx.candidate
          # Record state before modifying the live configuration, so a failed
          # syntax test can be restored by the rollback step.
          ssh hetzner-deploy 'sudo -n test -f /etc/nginx/sites-available/koreni.org.ua'
          ssh hetzner-deploy \
            "sudo -n cp /etc/nginx/sites-available/koreni.org.ua /tmp/koreni-nginx.backup.$RUN_ID"
          echo 'backup_created=true' >> "$GITHUB_OUTPUT"
          ssh hetzner-deploy \
            'sudo -n cp /tmp/koreni-nginx.candidate /etc/nginx/sites-available/koreni.org.ua && sudo -n nginx -t && sudo -n systemctl reload nginx'

      - name: Verify public routes
        if: steps.nginx.outputs.changed == 'true'
        run: |
          set -euo pipefail
          site="${SITE_URL:-https://koreni.org.ua}"
          check() {
            local url="$1" expected="$2" actual
            actual=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url")
            [[ "$actual" == "$expected" ]] || { echo "$url returned $actual, expected $expected"; return 1; }
          }
          check "${site%/}/" 200
          check "${site%/}/api/health" 200 || check "${site%/}/api/submit" 405 || check "${site%/}/api/" 404
          check "${site%/}/t/health" 200 || check "${site%/}/t/keys" 401 || check "${site%/}/t/" 404
          check "${site%/}/comments/" 200 || check "${site%/}/comments/" 404

      - name: Roll back Nginx on failure
        if: failure() && steps.nginx_deploy.outputs.backup_created == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh hetzner-deploy \
            "sudo -n cp /tmp/koreni-nginx.backup.$RUN_ID /etc/nginx/sites-available/koreni.org.ua && sudo -n nginx -t && sudo -n systemctl reload nginx"

      - name: Remove Nginx temporary files
        if: always() && steps.nginx_deploy.outputs.backup_created == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          ssh hetzner-deploy "sudo -n rm -f /tmp/koreni-nginx.backup.$RUN_ID /tmp/koreni-nginx.candidate" || true
