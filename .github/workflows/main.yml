concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Check, Build, Deploy
permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - '*'
      - 'data/**'
      - 'scripts/server/**'
      - 'src/app/**'
      - 'src/server/**'
      - 'src/shared/**'
      - 'src/types/**'
      - '.github/workflows/main.yml'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tools via Mise
        uses: jdx/mise-action@v4

      - name: Cache yarn dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tools via Mise
        uses: jdx/mise-action@v4

      - name: Cache yarn dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type check
        run: yarn typecheck

  test:
    needs:
      - lint
      - typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tools via Mise
        uses: jdx/mise-action@v4

      - name: Cache yarn dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run frontend tests
        run: yarn test --run
        env:
          NEXT_PUBLIC_GITHUB_OWNER: owner
          NEXT_PUBLIC_GITHUB_REPO: repo
          NEXT_PUBLIC_TYPESENSE_SEARCH_KEY: typesense-search-key
          NEXT_PUBLIC_TYPESENSE_HOST: typesense-host
          NEXT_PUBLIC_SITE: site

      - name: Run server tests
        run: yarn exec vitest run --root src/server
        env:
          NEXT_PUBLIC_GITHUB_OWNER: owner
          NEXT_PUBLIC_GITHUB_REPO: repo
          NEXT_PUBLIC_TYPESENSE_SEARCH_KEY: typesense-search-key
          NEXT_PUBLIC_TYPESENSE_HOST: typesense-host
          NEXT_PUBLIC_SITE: site

  build:
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tools via Mise
        uses: jdx/mise-action@v4

      - name: Cache yarn dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Restore Next.js Build Cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, restore from a previous build's cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-

      - name: Build Next.js project
        run: yarn build
        env:
          NEXT_PUBLIC_BUGSNAG_API_KEY: ${{ vars.BUGSNAG_API_KEY }}
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
          NEXT_PUBLIC_LOCATIONIQ_KEY: ${{ secrets.LOCATIONIQ_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          NEXT_PUBLIC_REMARK42_HOST: ${{ vars.REMARK42_HOST }}
          NEXT_PUBLIC_SITE: ${{ vars.SITE }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_TYPESENSE_SEARCH_KEY: ${{ vars.TYPESENSE_SEARCH_KEY }}
          NEXT_PUBLIC_TYPESENSE_HOST: ${{ vars.TYPESENSE_HOST }}
          NODE_ENV: production

      # 3. Upload Artifacts
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: out

  build-api:
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tools via Mise
        uses: jdx/mise-action@v4

      - name: Cache yarn dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build API project
        run: |
          yarn exec tsc --project src/server/tsconfig.json
          cp src/server/package.json src/server/dist/

      - name: Install production dependencies
        run: yarn workspaces focus koreni-server --production

      - name: Upload backend artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-dist
          path: src/server/dist

      - name: Upload backend node_modules artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-node-modules
          path: node_modules

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.SERVER_IP }} >> ~/.ssh/known_hosts

      # --- Frontend Deploy ---
      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Deploy Frontend Files
        run: |
          rsync -avz --no-o --no-g -e "ssh" --delete ./dist/ ${{ secrets.SSH_USERNAME }}@${{ vars.SERVER_IP }}:/var/www/html
          ssh ${{ secrets.SSH_USERNAME }}@${{ vars.SERVER_IP }} 'sudo chown -R ${{ secrets.SSH_USERNAME }}:www-data /var/www/html && sudo chmod -R 755 /var/www/html'

      - name: Reload Nginx
        run: |
          ssh ${{ secrets.SSH_USERNAME }}@${{ vars.SERVER_IP }} << 'EOF'
            # Restart Service
            sudo systemctl reload nginx
          EOF

  deploy-api:
    runs-on: ubuntu-latest
    needs:
      - build-api
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.SERVER_IP }} >> ~/.ssh/known_hosts

      # --- Backend Deploy ---
      - name: Download backend source
        uses: actions/download-artifact@v8
        with:
          name: api-dist
          path: api-dist

      - name: Download backend node_modules
        uses: actions/download-artifact@v8
        with:
          name: api-node-modules
          path: api-node-modules

      # 1. Verify manifest files exist before deploying (Safety Check)
      - name: Check for package.json
        run: |
          if [ ! -f ./api-dist/package.json ]; then
            echo "Error: package.json missing in artifact. Ensure build script copies it to dist."
            exit 1
          fi

      - name: Deploy Backend Source
        run: |
          # Ensure target directory exists
          ssh ${{ secrets.SSH_USERNAME }}@${{ vars.SERVER_IP }} 'mkdir -p /var/www/koreni-api'

          # Sync compiled dist files
          rsync -avz --no-o --no-g -e "ssh" --delete ./api-dist/ ${{ secrets.SSH_USERNAME }}@${{ vars.SERVER_IP }}:/var/www/koreni-api

      - name: Deploy node_modules to server
        run: |
          rsync -avz --no-o --no-g -e "ssh" --delete ./api-node-modules/ ${{ secrets.SSH_USERNAME }}@${{ vars.SERVER_IP }}:/var/www/koreni-api/node_modules

      - name: Configure Environment and Restart Service
        run: |
          ssh ${{ secrets.SSH_USERNAME }}@${{ vars.SERVER_IP }} << 'EOF'
            set -e
            cd /var/www/koreni-api
            
            # Write .env to the correct directory
            echo "PORT=4000" > .env
            echo "BUGSNAG_API_API_KEY=${{ secrets.BUGSNAG_API_API_KEY }}" >> .env
            echo "GITHUB_TOKEN=${{ secrets.IMPORT_TOKEN }}" >> .env
            echo "GITHUB_REPO=${{ github.repository }}" >> .env
            echo "TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}" >> .env
            echo "POSTHOG_KEY=${{ secrets.POSTHOG_KEY }}" >> .env
            echo "POSTHOG_HOST=${{ vars.POSTHOG_HOST }}" >> .env
            echo "NEXT_PUBLIC_SITE=${{ vars.SITE }}" >> .env
            echo "NODE_ENV=production" >> .env
            echo "VALID_API_KEYS=${{ vars.VALID_API_KEYS }}" >> .env
            echo "GITHUB_OAUTH_CLIENT_ID=${{ secrets.OAUTH_CLIENT_ID }}" >> .env
            echo "GITHUB_OAUTH_CLIENT_SECRET=${{ secrets.OAUTH_CLIENT_SECRET }}" >> .env
             echo "FALLBACK_EMAIL=${{ secrets.FALLBACK_EMAIL }}" >> .env
             
             # Restart Service
             sudo systemctl restart koreni-api

             # Verify the service started successfully
             MAX_ATTEMPTS=12
             SLEEP_INTERVAL=5
             attempt=0
             while [ $attempt -lt $MAX_ATTEMPTS ]; do
               if sudo systemctl is-active --quiet koreni-api; then
                 echo "koreni-api is active."
                 break
               fi
               attempt=$((attempt + 1))
               echo "Waiting for koreni-api to become active... (attempt $attempt/$MAX_ATTEMPTS)"
               sleep $SLEEP_INTERVAL
             done

              if ! sudo systemctl is-active --quiet koreni-api; then
                echo "ERROR: koreni-api failed to start after $((MAX_ATTEMPTS * SLEEP_INTERVAL))s."
                echo "--- journalctl output ---"
                sudo journalctl -u koreni-api -n 50 --no-pager
                exit 1
              fi
          EOF

  deploy-nginx:
    runs-on: ubuntu-latest
    needs:
      - build
      - build-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check for Nginx changes
        id: check_nginx
        run: |
          if git diff-tree --no-commit-id --name-only -r ${{ github.sha }} | grep -qE '^scripts/server/nginx'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up SSH
        if: steps.check_nginx.outputs.changed == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy and Validate Nginx Configuration
        if: steps.check_nginx.outputs.changed == 'true'
        run: |
          scp scripts/server/nginx.conf ${{ secrets.SSH_USERNAME }}@${{ vars.SERVER_IP }}:/tmp/nginx.conf.candidate

          ssh ${{ secrets.SSH_USERNAME }}@${{ vars.SERVER_IP }} << 'EOF'
            set -e
            TARGET="/etc/nginx/sites-available/koreni.org.ua"
            BACKUP="/etc/nginx/sites-available/koreni.org.ua.bak"
            CANDIDATE="/tmp/nginx.conf.candidate"

            if [ -f "$TARGET" ]; then
              sudo cp "$TARGET" "$BACKUP"
            fi

            sudo cp "$CANDIDATE" "$TARGET"
            rm -f "$CANDIDATE"

            if ! sudo nginx -t; then
              echo "ERROR: Nginx syntax validation failed. Rolling back configuration."
              if [ -f "$BACKUP" ]; then
                sudo cp "$BACKUP" "$TARGET"
                sudo systemctl reload nginx
              fi
              exit 1
            fi

            sudo systemctl reload nginx
            echo "Nginx successfully reloaded with new configuration."
          EOF

      - name: Verify Routes and Health
        if: steps.check_nginx.outputs.changed == 'true'
        run: |
          SITE_URL="${{ vars.SITE }}"
          if [ -z "$SITE_URL" ]; then
            SITE_URL="https://koreni.org.ua"
          fi

          echo "Performing post-deployment health checks on $SITE_URL..."

          verify_endpoint() {
            local url="$1"
            local expected_code="$2"
            echo "Checking $url (expecting HTTP $expected_code)..."
            local http_code
            http_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url" || echo "000")
            if [ "$http_code" != "$expected_code" ]; then
              echo "ERROR: $url returned HTTP $http_code (expected $expected_code)"
              return 1
            fi
            echo "SUCCESS: $url returned HTTP $http_code"
            return 0
          }

          verify_endpoint "$SITE_URL/" "200" || exit 1
          verify_endpoint "$SITE_URL/api/health" "200" || verify_endpoint "$SITE_URL/api/submit" "405" || verify_endpoint "$SITE_URL/api/" "404" || exit 1
          verify_endpoint "$SITE_URL/t/health" "200" || verify_endpoint "$SITE_URL/t/keys" "401" || verify_endpoint "$SITE_URL/t/" "404" || exit 1
          verify_endpoint "$SITE_URL/comments/" "200" || verify_endpoint "$SITE_URL/comments/" "404" || exit 1

      - name: Rollback on Verification Failure
        if: failure() && steps.check_nginx.outputs.changed == 'true'
        run: |
          echo "Health check failed. Rolling back Nginx configuration..."
          ssh ${{ secrets.SSH_USERNAME }}@${{ vars.SERVER_IP }} << 'EOF'
            TARGET="/etc/nginx/sites-available/koreni.org.ua"
            BACKUP="/etc/nginx/sites-available/koreni.org.ua.bak"

            if [ -f "$BACKUP" ]; then
              echo "Restoring backup Nginx configuration..."
              sudo cp "$BACKUP" "$TARGET"
              sudo systemctl reload nginx
              echo "Rollback completed."
            else
              echo "WARNING: No backup file found to rollback to."
            fi
          EOF
