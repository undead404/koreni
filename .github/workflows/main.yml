concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Check, Build, Deploy
permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - '*'
      - 'data/**'
      - 'src/app/**'
      - 'src/server/**'
      - 'src/shared/**'
      - 'src/types/**'
      - '.github/workflows/main.yml'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tools via Mise
        uses: jdx/mise-action@v4

      - name: Cache yarn dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tools via Mise
        uses: jdx/mise-action@v4

      - name: Cache yarn dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type check
        run: yarn typecheck

  test:
    needs:
      - lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tools via Mise
        uses: jdx/mise-action@v4

      - name: Cache yarn dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run frontend tests
        run: yarn test --run
        env:
          NEXT_PUBLIC_GITHUB_OWNER: owner
          NEXT_PUBLIC_GITHUB_REPO: repo
          NEXT_PUBLIC_TYPESENSE_SEARCH_KEY: typesense-search-key
          NEXT_PUBLIC_TYPESENSE_HOST: typesense-host
          NEXT_PUBLIC_SITE: site

      - name: Run server tests
        run: yarn exec vitest run --root src/server
        env:
          NEXT_PUBLIC_GITHUB_OWNER: owner
          NEXT_PUBLIC_GITHUB_REPO: repo
          NEXT_PUBLIC_TYPESENSE_SEARCH_KEY: typesense-search-key
          NEXT_PUBLIC_TYPESENSE_HOST: typesense-host
          NEXT_PUBLIC_SITE: site

  build:
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tools via Mise
        uses: jdx/mise-action@v4

      - name: Cache yarn dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Restore Next.js Build Cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, restore from a previous build's cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-

      - name: Build Next.js project
        run: yarn build
        env:
          NEXT_PUBLIC_BUGSNAG_API_KEY: ${{ vars.BUGSNAG_API_KEY }}
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
          NEXT_PUBLIC_LOCATIONIQ_KEY: ${{ secrets.LOCATIONIQ_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          NEXT_PUBLIC_REMARK42_HOST: ${{ vars.REMARK42_HOST }}
          NEXT_PUBLIC_SITE: ${{ vars.SITE }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_TYPESENSE_SEARCH_KEY: ${{ vars.TYPESENSE_SEARCH_KEY }}
          NEXT_PUBLIC_TYPESENSE_HOST: ${{ vars.TYPESENSE_HOST }}
          NODE_ENV: production

      # 3. Upload Artifacts
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: out

  build-api:
    runs-on: ubuntu-latest
    needs:
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tools via Mise
        uses: jdx/mise-action@v4

      - name: Cache yarn dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build API project
        run: yarn exec tsc --project src/server/tsconfig.json

      - name: Install production dependencies
        run: yarn workspaces focus koreni-server --production

      - name: Set up SSH for node_modules deployment
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy node_modules to server
        run: |
          rsync -avz --no-o --no-g -e "ssh" --delete ./node_modules/ ${{ secrets.SSH_USERNAME }}@${{ vars.SERVER_IP }}:/var/www/koreni-api/node_modules

      - name: Upload backend artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-dist
          path: src/server/dist

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy-api
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.SERVER_IP }} >> ~/.ssh/known_hosts

      # --- Frontend Deploy ---
      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Deploy Frontend Files
        run: |
          rsync -avz --no-o --no-g -e "ssh" --delete ./dist/ ${{ secrets.SSH_USERNAME }}@${{ vars.SERVER_IP }}:/var/www/html
          ssh ${{ secrets.SSH_USERNAME }}@${{ vars.SERVER_IP }} 'sudo chown -R ${{ secrets.SSH_USERNAME }}:www-data /var/www/html && sudo chmod -R 755 /var/www/html'

      - name: Reload Nginx
        run: |
          ssh ${{ secrets.SSH_USERNAME }}@${{ vars.SERVER_IP }} << 'EOF'
            # Restart Service
            sudo systemctl reload nginx
          EOF

  deploy-api:
    runs-on: ubuntu-latest
    needs:
      - build
      - build-api
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.SERVER_IP }} >> ~/.ssh/known_hosts

      # --- Backend Deploy ---
      - name: Download backend source
        uses: actions/download-artifact@v8
        with:
          name: api-dist
          path: api-dist

      # 1. Verify manifest files exist before deploying (Safety Check)
      - name: Check for package.json
        run: |
          if [ ! -f ./api-dist/package.json ]; then
            echo "Error: package.json missing in artifact. Ensure build script copies it to dist."
            exit 1
          fi

      - name: Deploy Backend Source
        run: |
          # Ensure target directory exists
          ssh ${{ secrets.SSH_USERNAME }}@${{ vars.SERVER_IP }} 'mkdir -p /var/www/koreni-api'

          # Sync compiled dist files
          rsync -avz --no-o --no-g -e "ssh" --delete ./api-dist/ ${{ secrets.SSH_USERNAME }}@${{ vars.SERVER_IP }}:/var/www/koreni-api

      - name: Configure Environment and Restart Service
        run: |
          ssh ${{ secrets.SSH_USERNAME }}@${{ vars.SERVER_IP }} << 'EOF'
            set -e
            cd /var/www/koreni-api
            
            # Write .env to the correct directory
            echo "PORT=4000" > .env
            echo "BUGSNAG_API_API_KEY=${{ secrets.BUGSNAG_API_API_KEY }}" >> .env
            echo "GITHUB_TOKEN=${{ secrets.IMPORT_TOKEN }}" >> .env
            echo "GITHUB_REPO=${{ github.repository }}" >> .env
            echo "TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}" >> .env
            echo "POSTHOG_KEY=${{ secrets.POSTHOG_KEY }}" >> .env
            echo "POSTHOG_HOST=${{ vars.POSTHOG_HOST }}" >> .env
            echo "NEXT_PUBLIC_SITE=${{ vars.SITE }}" >> .env
            echo "NODE_ENV=production" >> .env
            echo "VALID_API_KEYS=${{ vars.VALID_API_KEYS }}" >> .env
            echo "GITHUB_OAUTH_CLIENT_ID=${{ secrets.OAUTH_CLIENT_ID }}" >> .env
            echo "GITHUB_OAUTH_CLIENT_SECRET=${{ secrets.OAUTH_CLIENT_SECRET }}" >> .env
            echo "FALLBACK_EMAIL=${{ secrets.FALLBACK_EMAIL }}" >> .env
            
            # Restart Service
            sudo systemctl restart koreni-api
          EOF
